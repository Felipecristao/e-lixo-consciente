<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Recuperar senha | E-Lixo Consciente</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="auth-page">
  <main class="auth-layout">
    <section class="auth-brand">
      <a href="index.html" class="logo">
        <div class="logo__icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/>
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
          </svg>
        </div>

        <span class="logo__text">
          E-Lixo <span>Consciente</span>
        </span>
      </a>

      <div class="auth-brand__content">
        <span class="label">Recuperacao</span>
        <h1>Recupere o acesso a sua conta.</h1>
        <p>Informe seu e-mail para gerar um link temporario de redefinicao de senha.</p>
      </div>
    </section>

    <section class="auth-card">
      <div class="auth-card__header">
        <span class="label">Senha</span>
        <h2>Esqueci minha senha</h2>
        <p>Digite o e-mail cadastrado na plataforma.</p>
      </div>

      <form id="esqueciSenhaForm" class="auth-form">
        <div class="form-group">
          <label for="email">E-mail</label>

          <input
            type="email"
            id="email"
            placeholder="seuemail@exemplo.com"
            required
          >
        </div>

        <div id="esqueciSenhaMensagem" class="form-message"></div>

        <div id="recuperacaoLinkBox" class="auth-reset-box" hidden></div>

        <button
          type="submit"
          id="btnSolicitarRecuperacao"
          class="btn btn--primary auth-submit"
        >
          Gerar link de recuperacao
        </button>
      </form>

      <a href="login.html" class="btn btn--outline-green auth-back">
        Voltar para o login
      </a>
    </section>
  </main>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/esqueci-senha.js"></script>
</body>
</html>
