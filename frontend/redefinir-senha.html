<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Redefinir senha | E-Lixo Consciente</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="auth-page">
  <main class="auth-layout">
    <section class="auth-brand">
      <a href="index.html" class="logo">
        <div class="logo__icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/>
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
          </svg>
        </div>

        <span class="logo__text">
          E-Lixo <span>Consciente</span>
        </span>
      </a>

      <div class="auth-brand__content">
        <span class="label">Nova senha</span>
        <h1>Defina uma nova senha de acesso.</h1>
        <p>Use uma senha com pelo menos 8 caracteres.</p>
      </div>
    </section>

    <section class="auth-card">
      <div class="auth-card__header">
        <span class="label">Seguranca</span>
        <h2>Redefinir senha</h2>
        <p>Informe a nova senha para concluir a recuperacao.</p>
      </div>

      <form id="redefinirSenhaForm" class="auth-form">
        <input type="hidden" id="token">

        <div class="form-group">
          <label for="novaSenha">Nova senha</label>

          <input
            type="password"
            id="novaSenha"
            minlength="8"
            autocomplete="new-password"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirmarSenha">Confirmar nova senha</label>

          <input
            type="password"
            id="confirmarSenha"
            minlength="8"
            autocomplete="new-password"
            required
          >
        </div>

        <div id="redefinirSenhaMensagem" class="form-message"></div>

        <button
          type="submit"
          id="btnRedefinirSenha"
          class="btn btn--primary auth-submit"
        >
          Salvar nova senha
        </button>
      </form>

      <a href="login.html" class="btn btn--outline-green auth-back">
        Voltar para o login
      </a>
    </section>
  </main>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/redefinir-senha.js"></script>
</body>
</html>
