<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Meu perfil | E-Lixo Consciente</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="assets/css/style.css"
  >
</head>

<body class="profile-page">

  <header class="dashboard-header">

    <div class="container dashboard-header__inner">

      <a
        href="index.html"
        class="logo"
      >
        <div class="logo__icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"
            />
            <path
              d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"
            />
          </svg>
        </div>

        <span class="logo__text">
          E-Lixo <span>Consciente</span>
        </span>
      </a>

      <div class="dashboard-header__actions">
        <a
          id="linkVoltarPainel"
          href="dashboard.html"
          class="btn header-login-btn"
        >
          Voltar ao painel
        </a>

        <div class="profile-menu">
          <button type="button" class="header-profile-avatar profile-menu__trigger" aria-label="Abrir menu do perfil" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          </button>
          <div class="profile-menu__dropdown" role="menu">
            <a href="perfil.html" role="menuitem">Meu perfil</a>
            <button type="button" class="profile-menu__logout" role="menuitem">Sair</button>
          </div>
        </div>
      </div>

    </div>

  </header>

  <main>

    <section class="profile-hero">
      <div class="container">
        <span class="dashboard-label">
          Dados do usuario
        </span>

        <h1>
          Meu perfil
        </h1>

        <p>
          Atualize suas informacoes pessoais e dados de endereco quando quiser.
        </p>
      </div>
    </section>

    <section class="profile-content">
      <div class="container">
        <form
          id="perfilForm"
          class="profile-card"
        >
          <div class="profile-card__header">
            <div>
              <span class="label">
                Cadastro
              </span>

              <h2>
                Informacoes pessoais
              </h2>
            </div>

            <span class="profile-card__note">
              * obrigatorio
            </span>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label for="nome">
                Nome *
              </label>

              <input
                type="text"
                id="nome"
                required
              >
            </div>

            <div class="form-group">
              <label for="email">
                E-mail
              </label>

              <input
                type="email"
                id="email"
                disabled
              >
            </div>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label for="telefone">
                Telefone
              </label>

              <input
                type="text"
                id="telefone"
                inputmode="tel"
                autocomplete="tel"
              >
            </div>

            <div class="form-group">
              <label for="dataNascimento">
                Data de nascimento
              </label>

              <input
                type="date"
                id="dataNascimento"
              >
            </div>
          </div>

          <div class="profile-divider"></div>

          <div class="profile-card__header">
            <div>
              <span class="label">
                Endereco
              </span>

              <h2>
                Localizacao
              </h2>
            </div>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label for="cep">
                CEP
              </label>

              <input
                type="text"
                id="cep"
                placeholder="00000-000"
                maxlength="9"
                inputmode="numeric"
                autocomplete="postal-code"
                aria-describedby="cepStatus"
              >

              <small
                id="cepStatus"
                class="cep-status"
                aria-live="polite"
              ></small>
            </div>

            <div class="form-group">
              <label for="numero">
                Numero
              </label>

              <input
                type="text"
                id="numero"
                autocomplete="address-line2"
              >
            </div>
          </div>

          <div class="form-group">
            <label for="rua">
              Rua
            </label>

            <input
              type="text"
              id="rua"
              autocomplete="address-line1"
            >
          </div>

          <div class="form-group">
            <label for="bairro">
              Bairro
            </label>

            <input
              type="text"
              id="bairro"
              autocomplete="address-level3"
            >
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label for="cidade">
                Cidade
              </label>

              <input
                type="text"
                id="cidade"
                autocomplete="address-level2"
              >
            </div>

            <div class="form-group">
              <label for="estado">
                Estado
              </label>

              <input
                type="text"
                id="estado"
                maxlength="2"
                placeholder="PR"
                autocomplete="address-level1"
              >
            </div>
          </div>

          <div class="form-group">
            <label for="complemento">
              Complemento
            </label>

            <input
              type="text"
              id="complemento"
              autocomplete="address-line3"
            >
          </div>

          <div
            id="perfilMensagem"
            class="form-message"
          ></div>

          <div class="profile-actions">
            <a
              href="dashboard.html"
              class="btn btn--outline-green"
            >
              Cancelar
            </a>

            <button
              type="submit"
              id="btnSalvarPerfil"
              class="btn btn--primary"
            >
              Salvar alteracoes
            </button>
          </div>
        </form>

        <form
          id="senhaForm"
          class="profile-card profile-password-card"
        >
          <div class="profile-card__header">
            <div>
              <span class="label">
                Segurança
              </span>

              <h2>
                Trocar senha
              </h2>
            </div>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label for="senhaAtual">
                Senha atual *
              </label>

              <input
                type="password"
                id="senhaAtual"
                autocomplete="current-password"
                required
              >
            </div>

            <div class="form-group">
              <label for="novaSenha">
                Nova senha *
              </label>

              <input
                type="password"
                id="novaSenha"
                minlength="8"
                autocomplete="new-password"
                required
              >
            </div>
          </div>

          <div class="form-group">
            <label for="confirmarNovaSenha">
              Confirmar nova senha *
            </label>

            <input
              type="password"
              id="confirmarNovaSenha"
              minlength="8"
              autocomplete="new-password"
              required
            >
          </div>

          <div
            id="senhaMensagem"
            class="form-message"
          ></div>

          <div class="profile-actions">
            <button
              type="submit"
              id="btnSalvarSenha"
              class="btn btn--primary"
            >
              Alterar senha
            </button>
          </div>
        </form>
      </div>
    </section>

  </main>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/perfil.js"></script>
  <script src="assets/js/perfil-menu.js"></script>
</body>
</html>
