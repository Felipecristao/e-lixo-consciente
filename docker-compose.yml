services:

  mariadb:

    image: mariadb:11

    container_name: elixo-db

    restart: always

    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME:-elixo}
      MARIADB_USER: ${DB_USER:?Defina DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}

    ports:
      - "127.0.0.1:${DB_PUBLIC_PORT:-3307}:3306"

    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.prod.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data:
